    <style>
      /* Critical CSS - immediate render */
      body { margin: 0; background: #0a0a0f; font-family: 'Satoshi', sans-serif; }
      #root { min-height: 100vh; }
      
      /* Loading spinner while app loads */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        z-index: 9999;
      }
      .initial-loader::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid rgba(139, 92, 246, 0.2);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      
      /* Hide loader when app is ready */
      .app-loaded .initial-loader { display: none; }
    </style>
  </head>
  <body>
    <div class="initial-loader"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove loader when app mounts
      window.addEventListener('load', () => {
        requestAnimationFrame(() => {
          document.body.classList.add('app-loaded');
        });
      });
    </script>
  </body>
