    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Viewport - optimized for mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SEO Primary -->
    <title>Flavour | Menu Digitali QR per Bar, Ristoranti, Pub & Caffè - Zero Commissioni</title>

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://flavour.studiojem.it/" />
    
    <!-- Critical CSS for above-fold content -->
    <style>
      /* Critical CSS - immediate render */
      *, *::before, *::after { box-sizing: border-box; }
      body { 
        margin: 0; 
        background: #0a0a0f; 
        font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root { min-height: 100vh; min-height: 100dvh; }
      
      /* Loading spinner while app loads */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        z-index: 9999;
      }
      .initial-loader::after {
        content: '';
        width: 32px;
        height: 32px;
        border: 2px solid rgba(139, 92, 246, 0.2);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      
      /* Hide loader when app is ready */
      .app-loaded .initial-loader { 
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease-out;
      }
      
      /* Reduce motion for accessibility */
      @media (prefers-reduced-motion: reduce) {
        .initial-loader::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="initial-loader" aria-label="Caricamento..."></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove loader when app mounts
      window.addEventListener('load', () => {
        requestAnimationFrame(() => {
          document.body.classList.add('app-loaded');
        });
      });
      
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
