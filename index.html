<html lang="it">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Preconnect to font domains for faster loading -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    
    <!-- Premium Fonts: Fontshare - Only needed weights (400, 500, 700) with display=swap -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@500,700&display=swap" rel="stylesheet" />
    
    <!-- Preload critical hero images -->
    <link rel="preload" as="image" href="/src/assets/dashboard-preview.png" type="image/png" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Primary -->
    <title>Flavour | Menu Digitali QR per Ristoranti - Zero Commissioni</title>
    <meta name="description" content="Trasforma il tuo ristorante con menu digitali QR, prenotazioni online, delivery e takeaway. 30+ funzionalità, 5 lingue, 8 template. Pronto in 10 minuti. Zero commissioni." />
    <meta name="keywords" content="menu digitale, menu qr, ristorante digitale, prenotazioni online, delivery ristorante, takeaway, ordini online, qr code menu" />
    <meta name="author" content="Eduard Costin Udila - StudioJEM" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flavour.studiojem.it/" />
    <meta property="og:title" content="Flavour | Menu Digitali QR per Ristoranti" />
    <meta property="og:description" content="Menu QR, Prenotazioni, Delivery e Takeaway. Zero commissioni, 100% controllo. 30+ funzionalità in una piattaforma." />
    <meta property="og:image" content="https://flavour.studiojem.it/og-image.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://flavour.studiojem.it/" />
    <meta name="twitter:title" content="Flavour | Menu Digitali QR per Ristoranti" />
    <meta name="twitter:description" content="Menu QR, Prenotazioni, Delivery e Takeaway. Zero commissioni, 100% controllo." />
    <meta name="twitter:image" content="https://flavour.studiojem.it/og-image.png" />
    
    <!-- Theme -->
    <meta name="theme-color" content="#0a0a0f" />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://flavour.studiojem.it/" />
    
    <!-- Critical CSS for above-fold content -->
    <style>
      /* Critical CSS - immediate render */
      body { margin: 0; background: #0a0a0f; font-family: 'Satoshi', sans-serif; }
      #root { min-height: 100vh; }
      
      /* Loading spinner while app loads */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        z-index: 9999;
      }
      .initial-loader::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid rgba(139, 92, 246, 0.2);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      
      /* Hide loader when app is ready */
      .app-loaded .initial-loader { display: none; }
    </style>
  </head>
  <body>
    <div class="initial-loader"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove loader when app mounts
      window.addEventListener('load', () => {
        requestAnimationFrame(() => {
          document.body.classList.add('app-loaded');
        });
      });
    </script>
  </body>
</html>
